stages:
  train:
    cmd: python src/model.py
    deps:
      - src/model.py
      - params.yaml
      - train/train.csv
    outs:
      - best_model.pkl
      - scaler.pkl
      - feature_columns.json
      - target_column.json
      - X_train.npy
      - X_train_scaled.npy
      - X_test.npy
      - X_test_scaled.npy
      - y_train.npy
      - y_test.npy
  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - best_model.pkl
      - X_test_scaled.npy
      - y_test.npy
      - params.yaml
    metrics:
      - metrics.json:
          cache: false